services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: hackathon
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=mysql+mysqlconnector://user:password@db:3306/hackathon
    depends_on:
      - db

volumes:
  mysql_data:
